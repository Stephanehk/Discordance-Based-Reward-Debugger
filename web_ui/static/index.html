<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Automated Reward Repairer</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="dot"></div>
      <span class="brand">Automated Reward Repairer</span>
    </div>
    <div class="topbar-right">
      <span class="muted">workspace</span>
      <span id="workspace" class="chip">—</span>
      <span class="muted">·</span>
      <span id="status" class="chip status">idle</span>
    </div>
  </header>

  <div class="page-shell">
    <main id="feed" class="feed">
      <div class="empty-state" id="emptyState">
        <h1>Ready</h1>
        <p>The pipeline will push messages here as it runs. Trigger a step from your terminal (e.g. <code>/repair-setup</code>).</p>
      </div>
      <div id="thinking" class="thinking" aria-live="polite" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span class="thinking-label">Claude is thinking…</span>
      </div>
    </main>
  </div>

  <template id="tpl-text">
    <article class="msg msg-text">
      <div class="msg-body"></div>
    </article>
  </template>

  <template id="tpl-markdown">
    <article class="msg msg-md">
      <div class="msg-body md"></div>
    </article>
  </template>

  <template id="tpl-status">
    <article class="msg msg-status">
      <div class="msg-body"></div>
    </article>
  </template>

  <template id="tpl-divider">
    <hr class="divider" />
  </template>

  <template id="tpl-code">
    <article class="msg msg-code">
      <header class="msg-head">
        <span class="lang"></span>
        <span class="caption muted"></span>
      </header>
      <pre class="code-block"><code></code></pre>
    </article>
  </template>

  <template id="tpl-comparison">
    <article class="msg msg-cmp">
      <details class="cmp-details">
        <summary class="msg-head"><span class="label"></span></summary>
        <div class="cmp-viz"></div>
        <div class="cmp-why muted"></div>
        <details class="cmp-more">
          <summary>How the two trajectories differ in more detail</summary>
          <ul class="cmp-chars"></ul>
        </details>
        <details class="cmp-return">
          <summary>How the return is computed</summary>
          <p class="muted">The return is the sum of this reward function's per-step rewards over the trajectory.</p>
          <pre class="code-block"><code></code></pre>
        </details>
      </details>
    </article>
  </template>

  <template id="tpl-lottery">
    <article class="msg msg-cmp msg-lottery">
      <details class="cmp-details">
        <summary class="msg-head"><span class="label"></span></summary>
        <div class="lot-viz">
          <div class="lot-row lot-ab"></div>
          <div class="lot-row lot-c"></div>
        </div>
        <div class="cmp-why muted"></div>
        <div class="cmp-block"></div>
        <details class="cmp-return">
          <summary>How the return is computed</summary>
          <p class="muted">The return is the sum of this reward function's per-step rewards over the trajectory.</p>
          <pre class="code-block"><code></code></pre>
        </details>
      </details>
    </article>
  </template>

  <template id="tpl-image">
    <article class="msg msg-img">
      <div class="caption muted"></div>
      <img alt="" />
    </article>
  </template>

  <template id="tpl-video">
    <article class="msg msg-vid">
      <div class="caption muted"></div>
      <video controls preload="metadata"></video>
    </article>
  </template>

  <template id="tpl-question">
    <article class="msg msg-q">
      <header class="msg-head">
        <span class="label">Question</span>
        <span class="qstatus muted"></span>
      </header>
      <div class="q-prompt"></div>
      <div class="q-body"></div>
    </article>
  </template>

  <template id="tpl-cta">
    <article class="msg msg-cta">
      <div class="cta-prompt muted"></div>
      <button type="button" class="btn btn-cta"></button>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
